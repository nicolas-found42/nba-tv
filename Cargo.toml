[workspace]
resolver = "2"
members = [
    "crates/nbatv_catalog",
    "crates/nbatv_db",
    "crates/nbatv_ingest",
    "crates/nbatv_shell",
    "crates/nbatv_player",
    "crates/nbatv_ladder",
]

# Virtual manifest: no [package] here, so there is no binary to run and
# `default-run` is unset (no flagship binary yet).

[workspace.package]
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
# SQLite is declared once here; only `nbatv_db` depends on it and re-exports it
# (ADR 0003). Every other crate reaches it through `nbatv_db::rusqlite`.
rusqlite = { version = "0.32", features = ["bundled"] }

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
all = "warn"
