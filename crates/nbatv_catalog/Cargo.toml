[package]
name = "nbatv_catalog"
version = "0.1.0"
edition = "2021"
description = "TapeCatalog sweep engine: SourceProbe port, scorer, politeness, game-query evidence"
license = "MIT"

[dependencies]
nbatv_db = { path = "../nbatv_db", version = "0.1.0" }
nbatv_ladder = { path = "../nbatv_ladder", version = "0.1.0" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
httparse = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-graviola = "0.4"
webpki-roots = "1"

[dev-dependencies]
parking_lot = "0.12"
[lints]
workspace = true
