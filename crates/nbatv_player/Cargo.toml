[package]
name = "nbatv_player"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Player Backend lanes for the nba-tv archive: Lane A (ffmpeg-sidecar) and Lane B (sanctioned vendor embed)"
license = "MIT"
[lints]
workspace = true

[features]
default = []
# Optional audio output (default OFF: needs libasound on Linux). Decodes
# audio through a second ffmpeg sidecar into a cpal output stream.
audio = ["dep:cpal"]

[dependencies]
cpal = { version = "0.17", optional = true, default-features = false }
