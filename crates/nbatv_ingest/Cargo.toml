[package]
name = "nbatv_ingest"
version = "0.1.0"
edition = "2021"
description = "Bootstrap ingest for the nba-tv personal NBA archive (FTE CSV, validators, snapshot ingest into the archive db)"

[dependencies]
nbatv_db = { path = "../nbatv_db" }
nbatv_catalog = { path = "../nbatv_catalog", version = "0.1.0" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
